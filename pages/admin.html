<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão | leob.</title>
    <link rel="stylesheet" href="../css/tailwind-leob.css">
    
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&family=Playfair+Display:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="../js/config-leiloes.js"></script>
    <style>
        body {
            font-family: 'Comfortaa', cursive;
            background: #f6f2eb;
            color: #171717;
        }

        .serif {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col bg-zinc-100">

    <!-- Header Mobile -->
    <header class="md:hidden w-full bg-black text-white py-3 px-4 flex justify-between items-center shadow-md fixed top-0 left-0 right-0 z-40">
        <div class="flex items-center gap-3">
            <a href="../index.html"><img src="../images/logo/logo-white-gold-removebg-preview.png" alt="leob." class="max-h-14 cursor-pointer transition hover:scale-110"></a>
            <span class="text-xs tracking-widest uppercase opacity-70 border-l border-white/20 pl-3">Gestão</span>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="carregarDados()" class="text-xs text-brand-orange hover:text-white transition" title="Recarregar"><i class="fa-solid fa-rotate"></i></button>
            <button onclick="toggleSidebar()" class="text-white text-lg"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <!-- Sidebar Mobile (overlay) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-black text-white z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col shadow-xl">
        <div class="p-6 border-b border-white/10">
            <a href="../index.html" class="flex items-center gap-3">
                <img src="../images/logo/logo-white-gold-removebg-preview.png" alt="leob." class="max-h-16 cursor-pointer transition hover:scale-110">
            </a>
        </div>
        <nav class="flex-1 py-4">
            <a href="../catalogo.html" class="flex items-center gap-3 px-6 py-3 text-sm hover:bg-white/10 transition">
                <i class="fa-solid fa-house w-5 text-center text-brand-orange"></i> Catálogo
            </a>
            <a href="admin.html" class="flex items-center gap-3 px-6 py-3 text-sm bg-white/10 border-l-2 border-brand-orange">
                <i class="fa-solid fa-table-columns w-5 text-center text-brand-orange"></i> Painel de Gestão
            </a>
            <a href="leilao-admin.html" class="flex items-center gap-3 px-6 py-3 text-sm hover:bg-white/10 transition">
                <i class="fa-solid fa-gavel w-5 text-center text-brand-orange"></i> Leilões
            </a>
            <button onclick="carregarDados()" class="w-full flex items-center gap-3 px-6 py-3 text-sm hover:bg-white/10 transition text-left">
                <i class="fa-solid fa-rotate w-5 text-center text-brand-orange"></i> Recarregar
            </button>
        </nav>
        <div class="p-6 border-t border-white/10 text-xs text-zinc-500">
            &copy; 2025 leob.
        </div>
    </aside>

    <!-- Main Content -->
    <div class="md:ml-64 flex flex-col min-h-screen pt-14 md:pt-0">
    <main class="flex-grow p-6 max-w-7xl mx-auto w-full">

        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="serif text-3xl font-bold mb-2">Controle de Vendas e Entregas</h1>
                <p class="text-sm text-zinc-600">Lotes arrematados nos leilões: vencedor, valor e status do pagamento.</p>
            </div>
            <button onclick="carregarDados()"
                class="bg-brand-orange text-white px-6 py-3 font-bold uppercase tracking-widest text-xs hover:bg-black transition shadow-lg">
                <i class="fa-solid fa-rotate mr-2"></i> Recarregar
            </button>
        </div>

        <!-- Tabela -->
        <div class="bg-white shadow-xl overflow-hidden border border-zinc-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-zinc-100 text-xs uppercase tracking-widest text-zinc-500">
                            <th class="p-4 border-b border-zinc-200">Data</th>
                            <th class="p-4 border-b border-zinc-200">Cliente</th>
                            <th class="p-4 border-b border-zinc-200">Obra</th>
                            <th class="p-4 border-b border-zinc-200">Valor</th>
                            <th class="p-4 border-b border-zinc-200">Status</th>
                            <th class="p-4 border-b border-zinc-200">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo" class="text-sm">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-zinc-500">Carregando dados dos leilões...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    </div>

    <!-- Modal Editar Venda -->
    <div id="modal-registro"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center z-[60] p-4">
        <div class="bg-white p-8 w-full max-w-lg shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="serif text-2xl font-bold">Editar Venda</h2>
                <button onclick="fecharModal()" class="text-zinc-400 hover:text-black"><i
                        class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <form id="form-registro" class="space-y-4">
                <input type="hidden" id="lote-id" value="">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-1">Cliente</label>
                        <p id="venda-cliente" class="p-3 border border-zinc-300 bg-zinc-50 text-sm"></p>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-1">Obra</label>
                        <p id="venda-obra" class="p-3 border border-zinc-300 bg-zinc-50 text-sm"></p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-1">Valor
                            Arrematado</label>
                        <p id="venda-valor" class="p-3 border border-zinc-300 bg-zinc-50 text-sm"></p>
                    </div>
                    <div>
                        <label
                            class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-1">Status</label>
                        <select id="status"
                            class="w-full p-3 border border-zinc-300 bg-zinc-50 focus:border-brand-orange outline-none">
                            <option value="aguardando_pagamento">Aguardando Pagamento</option>
                            <option value="pago">Pago</option>
                            <option value="enviado">Enviado</option>
                            <option value="entregue">Entregue</option>
                            <option value="cancelado">Cancelado</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-1">Observações
                        (WhatsApp, endereço...)</label>
                    <textarea id="observacoes" rows="3"
                        class="w-full p-3 border border-zinc-300 bg-zinc-50 focus:border-brand-orange outline-none"></textarea>
                </div>
                <button type="submit"
                    class="w-full bg-black text-white py-4 font-bold uppercase tracking-[0.2em] hover:bg-brand-orange transition mt-4">
                    Salvar Status
                </button>
            </form>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // ---------- Status das vendas (léxico do backend de leilões) ----------
        const STATUS_LABEL = {
            'aguardando_pagamento': 'Aguardando Pagamento',
            'pago': 'Pago',
            'enviado': 'Enviado',
            'entregue': 'Entregue',
            'cancelado': 'Cancelado'
        };

        function statusClass(status) {
            switch (status) {
                case 'pago': return 'bg-green-100 text-green-800';
                case 'entregue': return 'bg-purple-100 text-purple-800';
                case 'enviado': return 'bg-blue-100 text-blue-800';
                case 'cancelado': return 'bg-red-100 text-red-800';
                default: return 'bg-yellow-100 text-yellow-800';
            }
        }

        function formatarData(ms) {
            if (!ms) return '---';
            const d = new Date(ms);
            return isNaN(d) ? '---' : d.toLocaleDateString('pt-BR');
        }

        function formatarValor(v) {
            if (v === null || v === undefined || isNaN(v)) return '---';
            return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Guarda as vendas para o modal de edição encontrar pelo lote_id
        let vendasCache = [];

        async function carregarDados() {
            const tbody = document.getElementById('tabela-corpo');
            if (!window.LEILOES || !window.LEILOES.api) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-brand-orange font-bold">Configuração dos leilões ausente (js/config-leiloes.js).</td></tr>';
                return;
            }

            tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-zinc-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Carregando...</td></tr>';

            try {
                const response = await fetch(window.LEILOES.api + '?action=vendas');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const dados = await response.json();
                if (!dados || !dados.ok || !Array.isArray(dados.vendas)) throw new Error('Resposta inesperada do backend');

                vendasCache = dados.vendas;

                if (dados.vendas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-zinc-500">Nada por aqui ainda.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                dados.vendas.forEach((v) => {
                    const status = v.status_pagamento || 'aguardando_pagamento';
                    const obs = (v.obs || '').trim();
                    const vencedor = v.vencedor || {};
                    const contato = (vencedor.whatsapp || '') + (vencedor.cidade ? ' · ' + vencedor.cidade + (vencedor.uf ? '/' + vencedor.uf : '') : '');

                    tbody.innerHTML += `
                        <tr class="hover:bg-zinc-50 transition border-b border-zinc-100">
                            <td class="p-4">${formatarData(v.arremate_em)}</td>
                            <td class="p-4 font-bold">
                                ${vencedor.nome || '?'}
                                <div class="text-[10px] font-normal text-zinc-500 mt-1 truncate max-w-[150px]">${obs || contato}</div>
                            </td>
                            <td class="p-4">${v.titulo || '---'}</td>
                            <td class="p-4 font-semibold">${formatarValor(v.valor_final)}</td>
                            <td class="p-4"><span class="px-2 py-1 text-xs font-bold uppercase tracking-wider ${statusClass(status)}">${STATUS_LABEL[status] || status}</span></td>
                            <td class="p-4">
                                <button onclick="editarVenda('${v.lote_id}')" class="text-zinc-400 hover:text-brand-orange transition px-2 py-1" title="Editar status">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-red-500">Erro ao conectar com o backend dos leilões. Verifique o Web App e tente novamente.</td></tr>';
            }
        }

        function editarVenda(loteId) {
            const v = vendasCache.find(x => String(x.lote_id) === String(loteId));
            if (!v) return;
            const vencedor = v.vencedor || {};
            document.getElementById('lote-id').value = v.lote_id || '';
            document.getElementById('venda-cliente').innerText = (vencedor.nome || '?') + (vencedor.whatsapp ? ' · ' + vencedor.whatsapp : '');
            document.getElementById('venda-obra').innerText = v.titulo || '---';
            document.getElementById('venda-valor').innerText = formatarValor(v.valor_final);
            document.getElementById('status').value = v.status_pagamento || 'aguardando_pagamento';
            document.getElementById('observacoes').value = v.obs || '';
            document.getElementById('modal-registro').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modal-registro').classList.add('hidden');
        }

        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loteId = document.getElementById('lote-id').value;
            if (!loteId || !window.LEILOES || !window.LEILOES.api) return;

            const btn = e.target.querySelector('button');
            const textoOriginal = btn.innerText;
            btn.innerText = 'Salvando...';
            btn.disabled = true;

            const dados = {
                action: 'setStatus',
                lote_id: loteId,
                status_pagamento: document.getElementById('status').value,
                obs: document.getElementById('observacoes').value
            };

            try {
                await fetch(window.LEILOES.api, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(dados)
                });

                fecharModal();
                e.target.reset();
                alert('Status salvo!');
                setTimeout(carregarDados, 2000);
            } catch (error) {
                console.error(error);
                alert('Erro ao salvar. Tente novamente.');
            } finally {
                btn.innerText = textoOriginal;
                btn.disabled = false;
            }
        });

        // Executa a carga inicial assegurando que o DOM está pronto
        window.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>

</html>
